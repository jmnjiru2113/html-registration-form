<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <h1>Registration Form</h1>
    <form Method="POST" Action="#">
        <fieldset>
        <legend>1.Personal Information</legend><b></b>
        <label for="Full Name">Name:</label>
        <input type="text" id="Full Name" name="Full Name" required
        required length="3" maxlength="50"><br><br>

        <label for="Email address">Email:</label>
        <input type="Email" id="Email address" name="Email address" required><br><br>

        <label for="Phone Number">Phone Number:</label>
        <input type="Phone Number" id="Phone Number" name="Phone Number" required><br><br>
        </fieldset>

        <fieldset>
        <legend>2.Company Information</legend>
        <label for="Company Name">Company Name:</label>
        <input type="text" id="Company Name" name="Company Name" required
        required length="3" maxlength="50"><br></br>

        <label for="Company Website">Company Website:</label>
        <input type="url" id="Company Website" name="Company Website" required><br></br>
        
        <label for="Company Size">Company Size:</label>
       <select id="size" name="size" required>
            <option value="">Select Company Size</option>
            <option value="1-10">1-10 Employees</option>
            <option value="11-20">11-20 Employees</option>
            <option value="21-30">21-30 Employees</option>

       </select><br></br>
       <label for="Industry">Industry:</label>
      <input type="text" id="Industry" name="Industry" required><br></br>
        </fieldset>

        <fieldset>
      <legend>3.Service Request</legend>
      <p>Service Type:</p>
      <Input type="radio" id="IT Services " name="Service Type" value="IT Services" required>
        <label for="IT Services">IT Services</label><br>
      <Input type="radio" id="Software Development" name="Service Type" value="Software Development" required>
        <label for="Software Development">Software Development</label><br>
        <input type="radio" id="Digital Marketing" name="Service Type" value="Digital Marketing" required>
        <label for="Digital Marketing">Digital Marketing</label><br>
        <input type="radio" id="It Consultation" name="Service Type" value="It Consultation" required>
        <label for="It Consultation">It Consultation</label><br>

        <p>Prefered Contact Method:</p>
        <input type="checkbox" id="Email" name="Contact Method" value="Email" required>
        <label for="Email">Email</label><br>
        <input type="checkbox" id="Phone" name="Contact Method" value="Phone" required>
        <label for="Phone">Phone</label><br>
        <input type="checkbox" id="Whatsapp" name="Contact Method" value="WhatsApp" required>
        <label for="Whatsapp">WhatsApp</label><br>  

        <Lable For="Appointment Date">Appointment Date:</Lable>
        <input type="date" id="Appointment Date" name="Appointment Date" required
        required min="01-01-2024" max="2024-12-31"><br></br>

        <lable for="Appointment Time">Appointment Time:</lable>
        <input type="time" id="Appointment Time" name="Appointment Time" required
        required min="08:00" max="18:00"><br></br> 

        <label for="Budget Range">Budget Range:</label>
        <select id="Budget Range" name="Budget Range" required>
            <option value="select budget range">select budget range</option>
            <option value="10000-20000">ksh10000-ksh20000</option>
            <option value="30000-60000">ksh30000-ksh60000</option>
            <option value="70000+">ksh70000+</option>
        </select><br></br>
        </fieldset>

        <fieldset>
        <legend>4.Message And Agreement</legend>
        <lable for="Message">Additional Information:</lable><br>
        <textarea id="Message" name="Message" rows="5" cols="50" required></textarea><br></br>
        <input type="checkbox" id="Terms And Conditions" name="Terms And Conditions" value="I agree to the terms and conditions" required>
        <lable for="Terms And Conditions">I agree to the terms and conditions</lable><br></br>
        </fieldset>
            
  <button type="submit">Submit</button>
  <button type="Reset">Reset</button>
    </form>
</body>
</html>
